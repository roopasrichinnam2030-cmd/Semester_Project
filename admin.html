<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneWave – Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body admin-body">

<div class="app-layout admin-layout">

  <!-- Admin Sidebar -->
  <aside class="sidebar admin-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#gradAdmin)" stroke-width="2">
        <defs>
          <linearGradient id="gradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ef4444"/>
          </linearGradient>
        </defs>
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <span>TuneWave <small>Admin</small></span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </button>
      <button class="nav-item" data-page="songs">
        <span class="nav-icon">🎵</span> Songs
      </button>
      <button class="nav-item" data-page="artists">
        <span class="nav-icon">🎤</span> Artists
      </button>
      <button class="nav-item" data-page="albums">
        <span class="nav-icon">💿</span> Albums
      </button>
      <button class="nav-item" data-page="users">
        <span class="nav-icon">👥</span> Users
      </button>
      <button class="nav-item" data-page="genres">
        <span class="nav-icon">🏷️</span> Genres
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline btn-block" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <!-- Admin Main -->
  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h2 class="page-title" id="adminPageTitle">Dashboard</h2>
      <div class="header-user">
        <div class="user-avatar admin-avatar">A</div>
        <span class="user-name">Administrator</span>
      </div>
    </header>

    <div class="page-container" id="adminPageContainer"></div>
  </main>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/music.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
