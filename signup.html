<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneWave – Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-brand">
    <div class="brand-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#grad2)" stroke-width="2">
        <defs>
          <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <h1>TuneWave</h1>
    </div>
    <p class="brand-tagline">Join the wave. Feel the music.</p>
    <ul class="brand-features">
      <li>✨ Free account</li>
      <li>🎧 Unlimited streaming</li>
      <li>📂 Custom playlists</li>
      <li>⭐ Save favorites</li>
    </ul>
  </div>

  <div class="auth-form-panel">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Start your musical journey today</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" autocomplete="name">
        <span class="error-msg" id="signupNameError"></span>
      </div>

      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
        <span class="error-msg" id="signupEmailError"></span>
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" autocomplete="new-password">
        <span class="error-msg" id="signupPasswordError"></span>
      </div>

      <div class="form-group">
        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password" autocomplete="new-password">
        <span class="error-msg" id="signupConfirmError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign Up</button>

      <p class="auth-switch">
        Already have an account? <a href="index.html">Login</a>
      </p>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  seedData();

  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const errorIds = ['signupNameError', 'signupEmailError', 'signupPasswordError', 'signupConfirmError'];
    clearErrors(errorIds);

    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;
    let valid = true;

    if (!name) { showError('signupNameError', 'Full name is required'); valid = false; }
    else if (name.length < 3) { showError('signupNameError', 'Name must be at least 3 characters'); valid = false; }

    if (!email) { showError('signupEmailError', 'Email is required'); valid = false; }
    else if (!isValidEmail(email)) { showError('signupEmailError', 'Enter a valid email address'); valid = false; }

    if (!password) { showError('signupPasswordError', 'Password is required'); valid = false; }
    else if (password.length < 6) { showError('signupPasswordError', 'Password must be at least 6 characters'); valid = false; }

    if (!confirm) { showError('signupConfirmError', 'Please confirm your password'); valid = false; }
    else if (password !== confirm) { showError('signupConfirmError', 'Passwords do not match'); valid = false; }

    if (!valid) return;

    const result = registerUser(name, email, password);
    if (result.success) {
      showToast('Account created! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = 'index.html', 1200);
    } else {
      showError('signupEmailError', result.message);
    }
  });
</script>
</body>
</html>
