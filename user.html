<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneWave – Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

<!-- ============ APP LAYOUT (CSS GRID) ============ -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#gradSide)" stroke-width="2">
        <defs>
          <linearGradient id="gradSide" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <span>TuneWave</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="home">
        <span class="nav-icon">🏠</span> Home
      </button>
      <button class="nav-item" data-page="browse">
        <span class="nav-icon">🎵</span> Browse
      </button>
      <button class="nav-item" data-page="search">
        <span class="nav-icon">🔍</span> Search
      </button>
      <button class="nav-item" data-page="playlists">
        <span class="nav-icon">📂</span> Playlists
      </button>
      <button class="nav-item" data-page="favorites">
        <span class="nav-icon">❤️</span> Favorites
      </button>
      <button class="nav-item" data-page="profile">
        <span class="nav-icon">👤</span> Profile
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-outline btn-block" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Top Header -->
    <header class="top-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search songs, artists, albums...">
      </div>
      <div class="header-user">
        <div class="user-avatar" id="headerAvatar">U</div>
        <span class="user-name" id="headerUserName">User</span>
      </div>
    </header>

    <!-- Page Container -->
    <div class="page-container" id="pageContainer">
      <!-- Pages rendered dynamically by user.js -->
    </div>

  </main>
</div>

<!-- ============ FIXED MUSIC PLAYER ============ -->
<div class="music-player" id="musicPlayer">
  <div class="player-left">
    <div class="player-art">
      <img id="playerArt" src="" alt="Album art">
    </div>
    <div class="player-info">
      <span class="player-title" id="playerTitle">No song playing</span>
      <span class="player-artist" id="playerArtist">—</span>
    </div>
    <button class="player-fav" id="playerFav" title="Toggle favorite">♡</button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
    </div>
    <div class="player-progress">
      <span class="time" id="currentTime">0:00</span>
      <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
      <span class="time" id="totalTime">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <span class="volume-icon">🔊</span>
    <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<!-- Hidden audio element -->
<audio id="audioPlayer"></audio>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/music.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
<script src="js/user.js"></script>
</body>
</html>
